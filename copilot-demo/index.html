<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Goals — Dev Days demo</title>
<style>body{font:18px/1.6 system-ui,sans-serif;background:#f2f5f3;color:#101411;margin:0;padding:32px}main{max-width:650px;margin:auto;background:white;padding:32px;border:1px solid #d8e3db;border-radius:18px}h1{line-height:1.1}label{display:block;font-weight:600}input,button{font:inherit;padding:12px;border:1px solid #909692;border-radius:8px}input{width:100%;box-sizing:border-box;margin:8px 0}button{background:#08872b;color:white;cursor:pointer}li{padding:8px}small{color:#57605a}*:focus-visible{outline:3px solid #8534f3;outline-offset:3px}</style></head>
<body><main><small>Prepared starter · not generated live</small><h1>My learning goals</h1><p>A small, offline demo. Reloading clears changes.</p><form id="add-form"><label for="goal">Add a goal</label><input id="goal" autocomplete="off" maxlength="150"><button>Add goal</button></form><ul id="goals"><li>Learn Git basics</li><li>Write a clear README</li><li>Review a pull request</li></ul><p id="status" role="status"></p></main>
<script>const form=document.getElementById('add-form'),input=document.getElementById('goal'),list=document.getElementById('goals'),status=document.getElementById('status');form.addEventListener('submit',event=>{event.preventDefault();const value=input.value.trim();if(!value){status.textContent='Enter a goal first.';return;}const item=document.createElement('li');item.textContent=value;list.append(item);input.value='';status.textContent='Goal added.';input.focus();});</script></body></html>
